<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="robots"
        content="noindex"
    >

    <title>Page Not Found | Fiber Optic Hub</title>

    <link
        rel="icon"
        type="image/svg+xml"
        href="images/favicon.svg"
    >

    <link
        rel="stylesheet"
        href="css/index.css"
    >

    <style>

        .error-page {

            min-height: calc(100vh - 64px);

            display: flex;

            flex-direction: column;

            justify-content: center;

            align-items: center;

            text-align: center;

            padding: 30px 20px;

        }

        .error-code {

            font-size: 80px;

            line-height: 1;

            color: #29b6f6;

            margin-bottom: 20px;

        }

        .error-page h1 {

            font-size: 30px;

            margin-bottom: 12px;

        }

        .error-page p {

            color: #aebdce;

            max-width: 500px;

            margin-bottom: 25px;

        }

    </style>

</head>


<body>


<header>

    <div class="logo">
        🔵 Fiber <span>Optic Hub</span>
    </div>

</header>


<main class="error-page">

    <div class="error-code">
        404
    </div>

    <h1>
        Page Not Found
    </h1>

    <p>
        The page you are looking for
        does not exist or may have been moved.
    </p>

    <a
        href="index.html"
        class="btn"
    >
        ← Back to Home
    </a>

</main>


<footer>

    © 2026 Fiber Optic Knowledge Hub

    <br>

    Learn • Practice • Share

</footer>


</body>

</html>
