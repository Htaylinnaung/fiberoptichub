Name: Build Articles

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      # =========================
      # CHECKOUT
      # =========================

      - name: Checkout
        uses: actions/checkout@v4


      # =========================
      # SETUP PYTHON
      # =========================

      - name: Setup Python
        uses: actions/setup-python@v5

        with:
          python-version: "3.x"


      # =========================
      # BUILD ARTICLES
      # =========================

      - name: Build Articles
        run: |
          python build_articles.py


      # =========================
      # COMMIT GENERATED FILES
      # =========================

      - name: Commit changes
        run: |

          git config user.name "github-actions[bot]"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"


          git add categories/all-articles.html

          git add index.html

          git add data/articles.json


          if git diff --cached --quiet; then

            echo "No changes to commit."

          else

            git commit -m "Auto update articles & JSON search index"

            git push

          fi
